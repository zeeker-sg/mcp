# .github/workflows/ci.yml
# CI for every PR and every push to main:
#   1. test job — the offline pytest suite (-m "not live"; live golden-path
#      tests need ZEEKER_LIVE=1 and hit production data.zeeker.sg, so they run
#      in live-tests.yml instead, never here).
#   2. docker job (push to main only, after tests pass) — builds the same
#      image docker-compose builds (Dockerfile at repo root) and publishes it
#      to ghcr.io/zeeker-sg/mcp tagged with the full commit SHA. The tag is
#      the only one published on purpose: it is immutable, so a deployed SHA
#      always resolves to the exact image built from that commit. Promote a
#      build with `docker pull ...@sha256:<digest>` rather than a moving tag.
#
# Action versions are pinned by SHA, matching the style of live-tests.yml
# and soak.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Collapse superseded in-progress runs on the same ref (e.g. an outdated
  # PR run after new pushes); a run on main is rarely superseded and, if it
  # is, the newer run rebuilds the newer SHA anyway.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (non-live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          version: "0.11.14"  # CLAUDE.md pinned version
          enable-cache: true

      - run: uv sync --frozen

      - name: Run non-live tests
        run: uv run pytest -m "not live" -p no:xdist

  docker:
    name: Build & publish image
    needs: test
    # Publish only on pushes to main (i.e. after a PR merged), never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (sha tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/zeeker-sg/mcp
          tags: |
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # avoid an untagged default-provenance manifest entry